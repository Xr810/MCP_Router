# Build a Windows installer on GitHub-hosted runners (more RAM than small Azure VMs).
# Download the artifact onto the 4GB Azure VM and run the packaged app there —
# do not run `pnpm dev` on the small VM.
name: Windows Azure Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - je/hermes-branding

jobs:
  windows-package:
    name: Package MCP Router (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: |
          pnpm --filter @mcp_router/shared build
          pnpm --filter @mcp_router/remote-api-types build
          pnpm --filter @mcp_router/ui build

      - name: Make Windows installers
        run: pnpm --filter @mcp_router/electron run make
        working-directory: .

      - name: List make output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse apps/electron/out/make | Select-Object FullName, Length

      - name: Upload Windows make artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp-router-windows-x64
          path: |
            apps/electron/out/make/**
          if-no-files-found: error
          retention-days: 14
