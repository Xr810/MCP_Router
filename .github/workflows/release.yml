# Build installers for every supported platform and attach them to a GitHub
# Release, so a deployment can download a packaged build without needing an
# Actions login or racing the artifact retention window.
#
# Trigger by pushing a tag:  git tag v0.6.3 && git push origin v0.6.3
#
# The release is created as a DRAFT. Review the assets, then publish it by
# hand. The Sustainable Use License allows distribution only free of charge
# and for non-commercial purposes — see LICENSE.md and NOTICE, both of which
# are attached to the release.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run make
        run: pnpm run make

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: make-${{ matrix.label }}
          path: apps/electron/out/make
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List downloaded assets
        run: find dist -type f | sort

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/**/*
            LICENSE.md
            NOTICE
          body: |
            Packaged builds of this fork of
            [MCP Router](https://github.com/mcp-router/mcp-router).

            **This is a modified build.** It is not affiliated with, endorsed
            by, or supported by the upstream authors — please do not report
            problems with it to the upstream project.

            Distributed under the Sustainable Use License, the same terms as
            upstream: free of charge, for non-commercial purposes. The full
            terms are in `LICENSE.md`, attached. `NOTICE` lists what this fork
            changes.

            The macOS build is unsigned unless signing credentials were
            configured for the run.
